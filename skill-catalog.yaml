# ==================================================================
# Dependency graph (topological order for installation)
# Layer 0 (no deps) → Layer 1 (depend on layer 0)
# ==================================================================
dependency_order:
  - [session-context, skill-creator, karpathy-guidelines, skills-sync, grill-me, teach, full-output-enforcement]
  - [algorithmic-art, brand-guidelines, brandkit, canvas-design, design-taste-frontend, design-taste-frontend-v1, frontend-design, gpt-taste, high-end-visual-design, image-to-code, imagegen-frontend-mobile, imagegen-frontend-web, impeccable, industrial-brutalist-ui, minimalist-ui, react-bits, redesign-existing-projects, stitch-design-taste, ui-ux-pro-max]
  - [doc-coauthoring, docx, internal-comms, pdf, pptx, theme-factory, xlsx]
  - [gsap-core, gsap-frameworks, gsap-performance, gsap-plugins, gsap-react, gsap-scrolltrigger, gsap-timeline, gsap-utils]
  - [a-stock-data, claude-api, mcp-builder, slack-gif-creator, video-shotcraft, web-artifacts-builder, webapp-testing]
  - [project-workflow, skiis-context, task-orchestrator, template]
