# skill-catalog.yaml
# Single source of truth for all managed skills.
# Used by install/sync/validate scripts for dependency resolution and metadata.

catalog_version: "1.0"
last_updated: "2026-07-06"

skills:
  session-context:
    version: "2.1.0"
    display_name: "Session Context Manager"
    layer: foundation
    description: >
      Auto-loads project context, tracks tasks/decisions/pitfalls,
      cross-project task dispatch, branch isolation, hooks management.
      MUST trigger on EVERY conversation in a dev project.
    dependencies: []
    commands:
      - context-check
      - context-sync
      - session-end
      - session-load
      - session-save
      - task-send
    triggers_keywords:
      - 修改, 排查, debug, fix, change, investigate
      - generate, create, how to, 帮我, 实现, 开发
      - 优化, 重构, 测试, 部署, 编译, 运行
      - 报错, 失败, 问题, 保存上下文, 加载上下文, 继续工作
    tags:
      - context-management
      - session-persistence
      - auto-initialization

  project-workflow:
    version: "1.3.0"
    display_name: "Project Lifecycle Manager"
    layer: workflow
    description: >
      5-phase project lifecycle (Requirements -> Design -> Implementation ->
      Testing -> Acceptance), bug-fix automation, frontend integration.
    dependencies:
      - session-context
    commands:
      - workflow-start
      - workflow-status
      - workflow-review
    triggers_keywords:
      - 新项目, 新功能, 新模块, 新需求, 新增, 添加
      - 做一个, 实现一个, 开发一个, 项目管理, 开发流程
      - project workflow, requirements, 需求分析, 方案设计, 验收
      - 帮我做, 帮我写, 帮我开发, 帮我实现, 从头开始, 从零开始
    tags:
      - project-management
      - lifecycle
      - bug-fix

  task-orchestrator:
    version: "1.1.0"
    display_name: "Task Orchestrator"
    layer: orchestration
    description: >
      Parallel task scheduling, dependency analysis, multi-session orchestration.
    dependencies:
      - session-context
    commands:
      - task-plan
      - task-run
    triggers_keywords:
      - parallel, 并行, 同时执行, 多任务, 批量, 一起做, 一起改, 分步
    tags:
      - task-scheduling
      - parallelism
      - orchestration

# Computed dependency graph (for tooling).
# Install order: layer 0 first, then layer 1, etc.
dependency_order:
  - [session-context]
  - [project-workflow, task-orchestrator]
