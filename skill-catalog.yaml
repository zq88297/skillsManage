# skill-catalog.yaml
# Complete manifest of all managed Claude Code skills.
# Used by install/sync/validate scripts for dependency resolution and metadata.

catalog_version: "2.2"
last_updated: "2026-07-28"

skills:
  # ==================================================================
  # Foundation Layer — context and session persistence
  # ==================================================================
  session-context:
    version: "2.3.1"
    display_name: "Session Context Manager"
    layer: foundation
    description: >
      Persistent development context for cross-session, cross-branch,
      cross-project, or cross-environment handoff. Use only for explicit
      context load/save/resume/dispatch operations or work that must continue
      across multiple sessions; exclude routine one-shot development tasks.
    dependencies: []
    commands:
      - context-check
      - context-sync
      - session-end
      - session-load
      - session-save
      - task-send
    tags: [context-management, session-persistence, cross-environment-handoff, explicit-context-operations]

  # ==================================================================
  # Meta Layer — skill creation and coding guidelines
  # ==================================================================
  skill-creator:
    version: "1.0.0"
    display_name: "Skill Creator"
    layer: meta
    description: >
      Create new skills, modify and improve existing skills, and measure
      skill performance. Use when users want to create a skill from scratch,
      edit or optimize an existing skill, run evals, or benchmark performance.
    dependencies: []
    commands: []
    tags: [skill-creation, evaluation, optimization]

  full-output-enforcement:
    version: "1.0.0"
    display_name: "Full Output Enforcement"
    layer: meta
    description: >
      Enforce complete, unabridged output for tasks that require exhaustive code,
      documents, or generated artifacts. Prevents placeholder output and manages
      token-limit continuation cleanly.
    dependencies: []
    commands: []
    tags: [output, completeness, generation]

  karpathy-guidelines:
    version: "1.0.0"
    display_name: "Karpathy Coding Guidelines"
    layer: meta
    description: >
      Behavioral guidelines to reduce common LLM coding mistakes. Use when
      writing, reviewing, or refactoring code to avoid overcomplication,
      make surgical changes, surface assumptions, and define verifiable
      success criteria.
    dependencies: []
    commands: []
    tags: [coding-guidelines, best-practices, code-review]

  skills-sync:
    version: "2.0.0"
    display_name: "Skills Sync Command"
    layer: meta
    description: >
      Check whether the skills repository has newer or missing skills, then
      update the local installed skills from the repository. One-way sync:
      repository -> local installed skills. Does not commit or push.
    dependencies: []
    commands: []
    tags: [skills-management, sync, update, local-install]

  grill-me:
    version: "1.3.0"
    display_name: "追问式方案审查"
    layer: meta
    description: >
      通过连续追问对计划或设计进行压力测试，逐项展开决策树、消除歧义并形成共同理解。
      用于深入追问、质疑方案、审查设计或梳理决策；支持单选、多选和自由回答，并完整
      保存每轮可见沟通、决策变化和关联依据，生成可追溯的审查日志。
    dependencies: []
    commands: []
    tags: [interview, planning, design-review, stress-test, decision-tree]

